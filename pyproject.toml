[project]
name = "coursework-2"
version = "0.1.0"
description = ""
authors = [
    {name = "lutovinova_mariya",email = "bukovka09@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "psycopg2-binary (>=2.9.12,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.3.0,<3.0.0)"
]

    [tool.isort ]
    line_length = 119


    [tool.black]
line_length = 119
exclude = '''
(
  /(\.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
)
'''

    [tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'
